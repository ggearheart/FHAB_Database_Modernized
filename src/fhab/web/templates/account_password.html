{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block body %}
<h1>Change your password</h1>
{% if must %}
<div class="card" style="border-left:4px solid #b45309">
  <p style="margin:0">Your password was reset by an administrator. Please choose a new password to
    finish signing in.</p>
</div>
{% endif %}
<div class="card" style="max-width:34rem">
  <form method="post">
    <div style="display:flex; flex-direction:column; gap:.7rem">
      <div><label>Current password *</label>
        <input name="current" type="password" required autocomplete="current-password"></div>
      <div><label>New password * <span class="muted">(at least 8 characters)</span></label>
        <input name="new" type="password" required minlength="8" autocomplete="new-password"></div>
      <div><label>Confirm new password *</label>
        <input name="confirm" type="password" required minlength="8" autocomplete="new-password"></div>
    </div>
    <p></p>
    <button>Change password</button>
  </form>
</div>
{% endblock %}
